name: Android Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web application
        run: pnpm --filter @workspace/gy-data build

      - name: Add Android platform
        working-directory: artifacts/gy-data
        run: pnpm exec cap add android

      - name: Sync Capacitor Android
        working-directory: artifacts/gy-data
        run: pnpm exec cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Debug APK
        working-directory: artifacts/gy-data/android
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        working-directory: artifacts/gy-data/android
        run: ./gradlew bundleRelease

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/gy-data/android/app/build/outputs/apk/debug/app-debug.apk release/Gy-Data-Hub.apk
          cp artifacts/gy-data/android/app/build/outputs/bundle/release/app-release.aab release/Gy-Data-Hub.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gy-Data-Hub v1.0.${{ github.run_number }}
          body: |
            ## Gy-Data-Hub Android Release

            Download the APK below to install Gy-Data-Hub on Android.

            - Gy-Data-Hub.apk — Android installation file
            - Gy-Data-Hub.aab — Google Play upload file
          files: |
            release/Gy-Data-Hub.apk
            release/Gy-Data-Hub.aab
          generate_release_notes: true
