name: Build GY DATA Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Capacitor and Sharp
        working-directory: artifacts/gy-data
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli sharp

      - name: Build web application
        working-directory: artifacts/gy-data
        run: pnpm build

      - name: Remove old Android platform
        working-directory: artifacts/gy-data
        run: rm -rf android

      - name: Add Android platform
        working-directory: artifacts/gy-data
        run: pnpm exec cap add android

      - name: Sync Capacitor
        working-directory: artifacts/gy-data
        run: pnpm exec cap sync android

      - name: Generate GY DATA branding
        working-directory: artifacts/gy-data
        run: node scripts/create-android-branding.mjs

      - name: Verify GY DATA launcher
        working-directory: artifacts/gy-data
        run: |
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -f android/app/src/main/res/drawable/ic_launcher_background.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          if [ -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml ]; then
            echo "ERROR: Old Wi-Fi icon still exists."
            exit 1
          fi

          echo "GY DATA launcher verified."

      - name: Make Gradle executable
        working-directory: artifacts/gy-data/android
        run: chmod +x gradlew

      - name: Prepare Android signing
        working-directory: artifacts/gy-data/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > gy-data-release.keystore

          cat > signing.properties <<EOF
          storeFile=gy-data-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Android signing configuration prepared."

      - name: Configure release signing
        working-directory: artifacts/gy-data/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          signing_block = r'''
          def signingPropertiesFile = rootProject.file("signing.properties")
          def signingProperties = new Properties()

          if (signingPropertiesFile.exists()) {
              signingProperties.load(new FileInputStream(signingPropertiesFile))
          }
          '''

          if "signingPropertiesFile" not in text:
              text = signing_block + "\n" + text

          if "signingConfigs {" not in text:
              marker = "android {"
              replacement = '''android {
              signingConfigs {
                  release {
                      if (signingPropertiesFile.exists()) {
                          storeFile file(signingProperties["storeFile"])
                          storePassword signingProperties["storePassword"]
                          keyAlias signingProperties["keyAlias"]
                          keyPassword signingProperties["keyPassword"]
                      }
                  }
              }
          '''
              text = text.replace(marker, replacement, 1)

          if "signingConfig signingConfigs.release" not in text:
              release_marker = "buildTypes {"
              replacement = '''buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          '''
              text = text.replace(release_marker, replacement, 1)

          path.write_text(text)
          PY

      - name: Clean Android build
        working-directory: artifacts/gy-data/android
        run: ./gradlew clean

      - name: Build Release APK
        working-directory: artifacts/gy-data/android
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: artifacts/gy-data/android
        run: ./gradlew bundleRelease

      - name: Verify Release APK
        working-directory: artifacts/gy-data/android
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          echo "Release APK verified."

      - name: Verify Release AAB
        working-directory: artifacts/gy-data/android
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          echo "Release AAB verified."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gy-data-hub-release-apk
          path: artifacts/gy-data/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gy-data-hub-release-aab
          path: artifacts/gy-data/android/app/build/outputs/bundle/release/app-release.aab
