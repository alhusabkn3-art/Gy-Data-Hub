name: GY DATA Android Build & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: https://gy-data-hub-1.onrender.com

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify tools
        run: |
          node --version
          pnpm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build web application
        working-directory: artifacts/gy-data
        run: |
          pnpm build

      - name: Add Android platform
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap add android

      - name: Sync Capacitor Android
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap sync android

      - name: Generate Android branding
        working-directory: artifacts/gy-data
        run: |
          pnpm android:branding

      - name: Copy Android web assets
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap copy android

      - name: Make Gradle executable
        working-directory: artifacts/gy-data/android
        run: |
          chmod +x gradlew

      - name: Configure release signing
        working-directory: artifacts/gy-data/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode > gy-data-release.keystore

            test -s gy-data-release.keystore

            cat >> gradle.properties <<EOF

          GY_DATA_RELEASE_STORE_FILE=gy-data-release.keystore
          GY_DATA_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          GY_DATA_RELEASE_KEY_ALIAS=$KEY_ALIAS
          GY_DATA_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          text = path.read_text()

          if "GY_DATA_RELEASE_STORE_FILE" not in text:
              android_match = re.search(r'\bandroid\s*\{', text)

              if not android_match:
                  raise SystemExit(
                      "ERROR: android { block not found in app/build.gradle"
                  )

              signing = """
              signingConfigs {
                  release {
                      storeFile file(GY_DATA_RELEASE_STORE_FILE)
                      storePassword GY_DATA_RELEASE_STORE_PASSWORD
                      keyAlias GY_DATA_RELEASE_KEY_ALIAS
                      keyPassword GY_DATA_RELEASE_KEY_PASSWORD
                  }
              }
              """

              text = (
                  text[:android_match.end()]
                  + signing
                  + text[android_match.end():]
              )

          build_types_match = re.search(
              r'\bbuildTypes\s*\{',
              text
          )

          if not build_types_match:
              raise SystemExit(
                  "ERROR: buildTypes { block not found in app/build.gradle"
              )

          if "signingConfig signingConfigs.release" not in text:
              start = build_types_match.end()

              release_match = re.search(
                  r'\brelease\s*\{',
                  text[start:]
              )

              if release_match:
                  release_start = start + release_match.start()
                  opening = text.find("{", release_start)

                  depth = 0
                  closing = None

                  for index in range(opening, len(text)):
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                          if depth == 0:
                              closing = index
                              break

                  if closing is None:
                      raise SystemExit(
                          "ERROR: release buildType block is malformed"
                      )

                  release_body = text[release_start:closing]

                  release_body += """
                      signingConfig signingConfigs.release
                  """

                  text = (
                      text[:release_start]
                      + release_body
                      + text[closing:]
                  )
              else:
                  insert_at = build_types_match.end()

                  text = (
                      text[:insert_at]
                      + """
                  release {
                      signingConfig signingConfigs.release
                  }
                  """
                      + text[insert_at:]
                  )

          path.write_text(text)
          PY

            echo "Release signing configured."

          else
            echo "No Android signing secrets configured."
            echo "Release APK/AAB will be unsigned."
          fi

      - name: Verify Gradle project
        working-directory: artifacts/gy-data/android
        run: |
          test -f gradlew
          test -f settings.gradle
          test -f app/build.gradle

          ./gradlew --version

      - name: Clean Gradle project
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew clean --no-daemon

      - name: Build release APK
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Build release AAB
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate APK and AAB
        working-directory: artifacts/gy-data
        run: |
          set -e

          echo "APK files:"
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          echo "AAB files:"
          find android/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print

          APK_PATH="$(
            find android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          AAB_PATH="$(
            find android/app/build/outputs/bundle \
              -type f \
              -name "*.aab" \
              -print \
              | head -n 1
          )"

          test -n "$APK_PATH"
          test -n "$AAB_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

      - name: Prepare release files
        working-directory: artifacts/gy-data
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" release/GY-DATA.apk
          cp "$AAB_PATH" release/GY-DATA.aab

          cat > release/release-info.txt <<EOF
          GY DATA Android Release

          App ID: com.gydatahub.app
          App Name: GY DATA
          API: https://gy-data-hub-1.onrender.com

          APK: GY-DATA.apk
          AAB: GY-DATA.aab
          EOF

          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-APK
          path: artifacts/gy-data/release/GY-DATA.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-AAB
          path: artifacts/gy-data/release/GY-DATA.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: GY DATA Android v${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/gy-data/release/GY-DATA.apk
            artifacts/gy-data/release/GY-DATA.aab
            artifacts/gy-data/release/release-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
