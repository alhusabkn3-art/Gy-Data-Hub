name: GY DATA Android Build & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK + AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      VITE_API_URL: https://gy-data-hub-1.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify tools
        run: |
          node --version
          pnpm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build web application
        working-directory: artifacts/gy-data
        run: |
          pnpm build

      - name: Add Android platform
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap add android

      - name: Sync Capacitor
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap sync android

      - name: Generate Android branding
        working-directory: artifacts/gy-data
        run: |
          pnpm android:branding

      - name: Copy web assets
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap copy android

      - name: Make Gradle executable
        working-directory: artifacts/gy-data/android
        run: |
          chmod +x gradlew

      - name: Configure release signing
        working-directory: artifacts/gy-data/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then

            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > gy-data-release.keystore

            test -s gy-data-release.keystore

            cat >> gradle.properties <<EOF

          GY_DATA_RELEASE_STORE_FILE=gy-data-release.keystore
          GY_DATA_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          GY_DATA_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          GY_DATA_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          text = path.read_text()

          if "GY_DATA_RELEASE_STORE_FILE" not in text:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(GY_DATA_RELEASE_STORE_FILE)
                      storePassword GY_DATA_RELEASE_STORE_PASSWORD
                      keyAlias GY_DATA_RELEASE_KEY_ALIAS
                      keyPassword GY_DATA_RELEASE_KEY_PASSWORD
                  }
              }
          """

              match = re.search(r'android\s*\{', text)

              if not match:
                  raise SystemExit(
                      "ERROR: android block was not found in app/build.gradle"
                  )

              insert_at = match.end()
              text = text[:insert_at] + signing + text[insert_at:]

              build_types = re.search(
                  r'buildTypes\s*\{',
                  text
              )

              if not build_types:
                  raise SystemExit(
                      "ERROR: buildTypes block was not found in app/build.gradle"
                  )

              release_match = re.search(
                  r'release\s*\{',
                  text[build_types.end():]
              )

              if release_match:
                  release_start = (
                      build_types.end() +
                      release_match.start()
                  )

                  brace_start = text.find(
                      "{",
                      release_start
                  )

                  depth = 0
                  release_end = None

                  for i in range(brace_start, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              release_end = i + 1
                              break

                  if release_end is None:
                      raise SystemExit(
                          "ERROR: release buildType block is malformed"
                      )

                  old_block = text[release_start:release_end]

                  if "signingConfig" not in old_block:
                      new_block = old_block[:-1] + """
                      signingConfig signingConfigs.release
                  }"""

                      text = (
                          text[:release_start]
                          + new_block
                          + text[release_end:]
                      )

              else:
                  build_types_end = build_types.end()

                  release_block = """
                  release {
                      signingConfig signingConfigs.release
                  }
              """

                  text = (
                      text[:build_types_end]
                      + release_block
                      + text[build_types_end:]
                  )

              path.write_text(text)

          print("Release signing configuration complete.")
          PY

          else
            echo "No release signing secrets supplied."
            echo "The workflow will build unsigned release artifacts."
          fi

      - name: Show Android configuration
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew --version
          sed -n '1,260p' app/build.gradle

      - name: Clean Android build
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew clean --no-daemon

      - name: Build release APK
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Build release AAB
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        working-directory: artifacts/gy-data
        run: |
          set -e

          APK_PATH="$(
            find android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK: $APK_PATH"

      - name: Verify AAB
        working-directory: artifacts/gy-data
        run: |
          set -e

          AAB_PATH="$(
            find android/app/build/outputs/bundle \
              -type f \
              -name "*.aab" \
              -print \
              | head -n 1
          )"

          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB was not generated."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "AAB: $AAB_PATH"

      - name: Prepare release files
        working-directory: artifacts/gy-data
        run: |
          set -e

          rm -rf release
          mkdir -p release

          APK_PATH="$(
            find android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          AAB_PATH="$(
            find android/app/build/outputs/bundle \
              -type f \
              -name "*.aab" \
              -print \
              | head -n 1
          )"

          cp "$APK_PATH" release/GY-DATA.apk
          cp "$AAB_PATH" release/GY-DATA.aab

          cat > release/release-info.txt <<EOF
          GY DATA Android Release

          App ID: com.gydatahub.app
          App Name: GY DATA
          API: https://gy-data-hub-1.onrender.com

          APK: GY-DATA.apk
          AAB: GY-DATA.aab
          EOF

          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-APK
          path: artifacts/gy-data/release/GY-DATA.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-AAB
          path: artifacts/gy-data/release/GY-DATA.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: GY DATA Android v${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/gy-data/release/GY-DATA.apk
            artifacts/gy-data/release/GY-DATA.aab
            artifacts/gy-data/release/release-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
