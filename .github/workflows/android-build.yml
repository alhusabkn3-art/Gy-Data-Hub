name: Android Build & Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm --filter @workspace/gy-data build

      - name: Verify VITE_API_URL
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "ERROR: GitHub Actions secret VITE_API_URL is missing."
            echo "Add VITE_API_URL in:"
            echo "Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "VITE_API_URL is configured."

      - name: Add Android platform
        working-directory: artifacts/gy-data
        run: pnpm exec cap add android

      - name: Sync Capacitor Android
        working-directory: artifacts/gy-data
        run: pnpm exec cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Release APK
        working-directory: artifacts/gy-data/android
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: artifacts/gy-data/android
        run: ./gradlew bundleRelease

      - name: Prepare release files
        run: |
          mkdir -p release

          cp \
            artifacts/gy-data/android/app/build/outputs/apk/release/app-release.apk \
            release/Gy-Data-Hub-release.apk

          cp \
            artifacts/gy-data/android/app/build/outputs/bundle/release/app-release.aab \
            release/Gy-Data-Hub-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}

          name: GY DATA v1.0.${{ github.run_number }}

          body: |
            ## GY DATA Android Release

            Release APK:
            Gy-Data-Hub-release.apk

            Google Play bundle:
            Gy-Data-Hub-release.aab

          files: |
            release/Gy-Data-Hub-release.apk
            release/Gy-Data-Hub-release.aab

          generate_release_notes: true
