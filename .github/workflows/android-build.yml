import fs from "node:fs";
import path from "node:path";
import sharp from "sharp";

const projectRoot = process.cwd();

const logoPath = path.join(
  projectRoot,
  "public",
  "gy-data-logo.svg"
);

const androidMain = path.join(
  projectRoot,
  "android",
  "app",
  "src",
  "main"
);

if (!fs.existsSync(logoPath)) {
  throw new Error(`GY DATA logo not found: ${logoPath}`);
}

if (!fs.existsSync(androidMain)) {
  throw new Error(
    `Android project not found: ${androidMain}`
  );
}

const resDir = path.join(androidMain, "res");

const drawableDir = path.join(
  resDir,
  "drawable"
);

const drawableV24Dir = path.join(
  resDir,
  "drawable-v24"
);

const adaptiveIconDir = path.join(
  resDir,
  "mipmap-anydpi-v26"
);

fs.mkdirSync(drawableDir, { recursive: true });
fs.mkdirSync(drawableV24Dir, { recursive: true });
fs.mkdirSync(adaptiveIconDir, { recursive: true });

/*
 * --------------------------------------------------
 * REMOVE OLD CAPACITOR WIFI ICON
 * --------------------------------------------------
 */

const oldFiles = [
  path.join(
    drawableV24Dir,
    "ic_launcher_foreground.xml"
  ),

  path.join(
    drawableV24Dir,
    "ic_launcher_foreground.png"
  ),

  path.join(
    drawableDir,
    "ic_launcher_foreground.xml"
  ),

  path.join(
    drawableDir,
    "ic_launcher_foreground.png"
  ),
];

for (const file of oldFiles) {
  if (fs.existsSync(file)) {
    fs.unlinkSync(file);
    console.log(`Removed old resource: ${file}`);
  }
}

/*
 * --------------------------------------------------
 * NORMAL LAUNCHER ICONS
 * --------------------------------------------------
 */

const iconSizes = [
  ["mipmap-mdpi", 48],
  ["mipmap-hdpi", 72],
  ["mipmap-xhdpi", 96],
  ["mipmap-xxhdpi", 144],
  ["mipmap-xxxhdpi", 192],
];

for (const [folder, size] of iconSizes) {
  const outputDir = path.join(
    resDir,
    folder
  );

  fs.mkdirSync(outputDir, {
    recursive: true,
  });

  const iconPath = path.join(
    outputDir,
    "ic_launcher.png"
  );

  const roundIconPath = path.join(
    outputDir,
    "ic_launcher_round.png"
  );

  await sharp(logoPath)
    .resize(size, size, {
      fit: "contain",
      background: {
        r: 255,
        g: 255,
        b: 255,
        alpha: 1,
      },
    })
    .png()
    .toFile(iconPath);

  await sharp(logoPath)
    .resize(size, size, {
      fit: "contain",
      background: {
        r: 255,
        g: 255,
        b: 255,
        alpha: 1,
      },
    })
    .png()
    .toFile(roundIconPath);

  console.log(
    `Created ${folder}/ic_launcher.png`
  );
}

/*
 * --------------------------------------------------
 * ADAPTIVE ICON BACKGROUND
 * --------------------------------------------------
 */

const backgroundXml = `<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">

    <solid android:color="#FFFFFF" />

</shape>
`;

fs.writeFileSync(
  path.join(
    drawableDir,
    "ic_launcher_background.xml"
  ),
  backgroundXml,
  "utf8"
);

/*
 * --------------------------------------------------
 * ADAPTIVE ICON FOREGROUND
 *
 * IMPORTANT:
 * Do NOT create XML here.
 *
 * We deliberately use the actual GY DATA artwork
 * as PNG so the old Wi-Fi vector cannot appear.
 * --------------------------------------------------
 */

const foregroundPath = path.join(
  drawableDir,
  "ic_launcher_foreground.png"
);

await sharp(logoPath)
  .resize(432, 432, {
    fit: "contain",
    background: {
      r: 255,
      g: 255,
      b: 255,
      alpha: 1,
    },
  })
  .png()
  .toFile(foregroundPath);

console.log(
  "Created GY DATA adaptive foreground"
);

/*
 * --------------------------------------------------
 * ANDROID 8+ ADAPTIVE ICON
 * --------------------------------------------------
 */

const adaptiveIconXml = `<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

    <background
        android:drawable="@drawable/ic_launcher_background" />

    <foreground
        android:drawable="@drawable/ic_launcher_foreground" />

</adaptive-icon>
`;

fs.writeFileSync(
  path.join(
    adaptiveIconDir,
    "ic_launcher.xml"
  ),
  adaptiveIconXml,
  "utf8"
);

fs.writeFileSync(
  path.join(
    adaptiveIconDir,
    "ic_launcher_round.xml"
  ),
  adaptiveIconXml,
  "utf8"
);

/*
 * --------------------------------------------------
 * SPLASH IMAGE
 * --------------------------------------------------
 */

const splashPath = path.join(
  drawableDir,
  "gy_data_splash.png"
);

await sharp(logoPath)
  .resize(1024, 1024, {
    fit: "contain",
    background: {
      r: 255,
      g: 255,
      b: 255,
      alpha: 1,
    },
  })
  .png()
  .toFile(splashPath);

console.log(
  "Created GY DATA splash image"
);

console.log(
  "GY DATA Android branding generated successfully."
);
