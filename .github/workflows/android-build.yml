name: Android Build & Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Android API configuration
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL secret is not set."
            echo "Using production Render API fallback."
            echo "https://gy-data-hub-1.onrender.com"
          else
            echo "VITE_API_URL is configured."
          fi

      - name: Build web application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          pnpm --filter @workspace/gy-data build

      - name: Add Android platform
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap add android

      - name: Sync Capacitor Android
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap sync android

      - name: Generate GY DATA Android branding
        working-directory: artifacts/gy-data
        run: |
          pnpm android:branding

      - name: Verify generated branding
        working-directory: artifacts/gy-data
        run: |
          test -f android/app/src/main/res/drawable/gy_data_splash.png
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "GY DATA branding verified successfully."

      - name: Re-sync Capacitor after branding
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap copy android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Clean Android build
        working-directory: artifacts/gy-data/android
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: Build Release APK
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew bundleRelease

      - name: Prepare release files
        run: |
          mkdir -p release

          cp \
            artifacts/gy-data/android/app/build/outputs/apk/release/app-release.apk \
            release/Gy-Data-Hub-release.apk

          cp \
            artifacts/gy-data/android/app/build/outputs/bundle/release/app-release.aab \
            release/Gy-Data-Hub-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}

          name: GY DATA v1.0.${{ github.run_number }}

          body: |
            ## GY DATA Android Release

            Release APK:
            Gy-Data-Hub-release.apk

            Google Play bundle:
            Gy-Data-Hub-release.aab

          files: |
            release/Gy-Data-Hub-release.apk
            release/Gy-Data-Hub-release.aab

          generate_release_notes: true
