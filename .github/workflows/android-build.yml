name: Android Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/gy-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/gy-data/pnpm-lock.yaml

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Generate GY DATA Android branding
        run: pnpm android:branding

      - name: Copy Android web assets
        run: pnpm exec cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: artifacts/gy-data/android
        run: chmod +x gradlew

      - name: Clean Android build
        working-directory: artifacts/gy-data/android
        run: ./gradlew clean

      - name: Build Android release APK
        working-directory: artifacts/gy-data/android
        run: ./gradlew assembleRelease

      - name: Find generated APK
        working-directory: artifacts/gy-data
        run: |
          echo "Searching for generated APK..."
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Prepare release files
        working-directory: artifacts/gy-data
        run: |
          mkdir -p release

          APK_PATH="$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            echo "Available build outputs:"
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK found at:"
          echo "$APK_PATH"

          cp "$APK_PATH" release/GY-DATA-release.apk

          echo "Release APK prepared:"
          ls -lh release/GY-DATA-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-Android
          path: artifacts/gy-data/release/GY-DATA-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GY DATA Android v${{ github.run_number }}
          generate_release_notes: true
          files: artifacts/gy-data/release/GY-DATA-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
