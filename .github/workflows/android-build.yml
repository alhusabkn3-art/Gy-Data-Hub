name: Android APK Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install

      - name: Build web app
        run: |
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        working-directory: artifacts/gy-data/android
        run: |
          chmod +x gradlew

      - name: Build Release APK
        working-directory: artifacts/gy-data/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp artifacts/gy-data/android/app/build/outputs/apk/release/app-release.apk GY-DATA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-release-apk
          path: GY-DATA.apk
