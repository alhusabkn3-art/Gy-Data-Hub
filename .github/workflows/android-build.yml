# .github/workflows/android-build.yml

name: GY DATA Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build GY DATA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.17.1 --activate

      - name: Check versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/gy-data build

      - name: Create Android project
        working-directory: artifacts/gy-data
        run: |
          if [ ! -d "android" ]; then
            pnpm exec cap add android
          fi

      - name: Sync Capacitor Android
        working-directory: artifacts/gy-data
        run: |
          pnpm exec cap sync android

      - name: Generate GY DATA Android branding
        working-directory: artifacts/gy-data
        run: |
          pnpm exec node scripts/create-android-branding.mjs

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: artifacts/gy-data/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Upload GY DATA APK
        uses: actions/upload-artifact@v4
        with:
          name: gy-data-hub-apk
          path: artifacts/gy-data/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
