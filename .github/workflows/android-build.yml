name: Build GY DATA Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gy-data-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build GY DATA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Capacitor and Sharp
        working-directory: artifacts/gy-data
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli sharp

      - name: Build web application
        working-directory: artifacts/gy-data
        run: pnpm build

      - name: Create Android project
        working-directory: artifacts/gy-data
        run: pnpm exec cap add android

      - name: Sync Capacitor
        working-directory: artifacts/gy-data
        run: pnpm exec cap sync android

      - name: Generate GY DATA branding
        working-directory: artifacts/gy-data
        run: node scripts/create-android-branding.mjs

      - name: Verify GY DATA launcher
        working-directory: artifacts/gy-data
        run: |
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -f android/app/src/main/res/drawable/ic_launcher_background.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          if [ -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml ]; then
            echo "ERROR: Old Wi-Fi launcher resource detected."
            exit 1
          fi

          echo "GY DATA launcher verified."

      - name: Make Gradle executable
        working-directory: artifacts/gy-data/android
        run: chmod +x gradlew

      - name: Build installable APK
        working-directory: artifacts/gy-data/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: artifacts/gy-data/android
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "GY DATA APK created successfully."

      - name: Upload GY DATA APK
        uses: actions/upload-artifact@v4
        with:
          name: gy-data-hub-apk
          path: artifacts/gy-data/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
