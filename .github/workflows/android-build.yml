name: Android Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/gy-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify web dependencies
        run: |
          pnpm exec vite --version
          pnpm exec cap --version

      - name: Build web application
        run: pnpm build

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Generate GY DATA Android branding
        run: pnpm android:branding

      - name: Copy Android web assets
        run: pnpm exec cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Verify Android project
        working-directory: artifacts/gy-data/android
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          chmod +x gradlew
          ./gradlew --version

      - name: Clean Android project
        working-directory: artifacts/gy-data/android
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build release APK
        working-directory: artifacts/gy-data/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: artifacts/gy-data/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify APK and AAB
        run: |
          echo "======================================"
          echo "Generated Android files"
          echo "======================================"

          echo ""
          echo "APK:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print || true

          echo ""
          echo "AAB:"
          find android/app/build/outputs/bundle -type f -name "*.aab" -print || true

          APK_PATH="$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          AAB_PATH="$(find android/app/build/outputs/bundle -type f -name "*.aab" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: Release APK was not generated."
            echo ""
            echo "Android output directory:"
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          if [ -z "$AAB_PATH" ]; then
            echo ""
            echo "ERROR: Release AAB was not generated."
            echo ""
            echo "Android output directory:"
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo ""
          echo "APK: $APK_PATH"
          echo "AAB: $AAB_PATH"

      - name: Prepare release files
        run: |
          rm -rf release
          mkdir -p release

          APK_PATH="$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          AAB_PATH="$(find android/app/build/outputs/bundle -type f -name "*.aab" | head -n 1)"

          cp "$APK_PATH" release/GY-DATA-release.apk
          cp "$AAB_PATH" release/GY-DATA-release.aab

          echo ""
          echo "Final release files:"
          ls -lh release/

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GY-DATA-Android
          path: |
            artifacts/gy-data/release/GY-DATA-release.apk
            artifacts/gy-data/release/GY-DATA-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GY DATA Android v${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/gy-data/release/GY-DATA-release.apk
            artifacts/gy-data/release/GY-DATA-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
